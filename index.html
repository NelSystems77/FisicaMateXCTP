/* =========================================================
   8. EVENTOS GLOBALES
   ========================================================= */
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-act]"); if(!b) return;
  const act=b.dataset.act, i=+b.dataset.i;
  if(b.tagName==="A") e.preventDefault();
  switch(act){
    case "route": go(b.dataset.r); break;
    case "learn": learnInd=i; go("learn"); break;
    case "learnTab": learnInd=i; go("learn",{keepScroll:true}); break;
    case "practice": go("practice"); setTimeout(()=>{const el=document.querySelectorAll(".ind-card")[i-1]; if(el) el.scrollIntoView({behavior:"smooth",block:"center"});},50); break;
    case "startP": startPractice(i,+b.dataset.l); break;
    case "startInf": startInfinite(i); break;
    case "startErr": startErrors(); break;
    case "startExam": startExam(); break;
    case "startDiag": startDiag(); break;
    case "skip": session.ans[session.i]={v:"__skip",raw:"",skip:true}; nextQ(); break;
    case "retry": session.gtype?startTypePractice(session.gtype):session.mode==="cero"?startCero(session.station):session.mode==="inf"?startInfinite(session.ind):(session.ind?startPractice(session.ind,session.lvl):startErrors()); break;
    case "pick": { const s=session,q=s.items[s.i]; if(s.ans[s.i]&&s.ans[s.i].checked&&!EXL(s.mode)) return;
      const val=q.type==="tf"?b.dataset.v==="true":+b.dataset.v; s.ans[s.i]=Object.assign(s.ans[s.i]||{},{v:val,skip:false});
      document.querySelectorAll(".opt").forEach(o=>{const on=o===b;o.classList.toggle("sel",on);o.setAttribute("aria-checked",on);});
      if(EXL(s.mode)) refreshPalette(); break; }
    case "check": check(); break;
    case "hint": { const q=session.items[session.i]; session.hints=session.hints||{}; session.hints[session.i]=true; $("#hintbox").innerHTML=helpBoxes(q); break; }
    case "step": { session.steps=session.steps||{}; session.steps[session.i]=(session.steps[session.i]||0)+1; go("quiz",{keepScroll:true,focus:false}); const sb=document.querySelector(".stepbox"); if(sb) sb.scrollIntoView({behavior:"smooth",block:"nearest"}); break; }
    case "cero": go("cero"); break;
    case "decodeQ": { session.decode=session.decode||{}; session.decode[session.i]=true; go("quiz",{keepScroll:true,focus:false}); const d=document.querySelector(".decode"); if(d) d.scrollIntoView({behavior:"smooth",block:"nearest"}); break; }
    case "decodeRun": { $("#dec-out").innerHTML=decodeHTML($("#dec-in").value,false); const d=$("#dec-out .decode"); if(d) d.focus(); break; }
    case "decodeEx": { $("#dec-in").value=b.dataset.t; $("#dec-out").innerHTML=decodeHTML(b.dataset.t,false); break; }
    case "gotoType": { const el=document.getElementById(b.dataset.id); if(el){ el.open=true; el.scrollIntoView({behavior:"smooth",block:"start"}); } break; }
    case "practType": startTypePractice(b.dataset.id); break;
    case "station": go("station",{id:b.dataset.id}); break;
    case "startCero": startCero(b.dataset.id); break;
    case "next": nextQ(); break;
    case "prev": if(session.i>0){session.i--;go("quiz");} break;
    case "jump": session.i=+b.dataset.k; go("quiz",{keepScroll:true}); break;
    case "submitExam": submitExam(); break;
    case "quit":
      if(EXL(session.mode)&&!session.finished&&!confirm("¿Salir? Se perderán tus respuestas.")) return;
      if(session.mode==="cero"){ go("station",{id:session.station}); break; }
      if(session.mode==="practice"&&Object.values(session.ans).some(a=>a.checked)) go("result"); else go(EXL(session.mode)?session.mode:"practice");
      break;
    case "reset": if(confirm("¿Borrar todo tu progreso?")){S={done:{},exams:[],gen:0,diag:[],cero:{}};save();go("progress");} break;
  }
});
document.addEventListener("keydown",e=>{
  if(route!=="quiz"||!session) return;
  if(e.target.tagName==="INPUT"&&e.key!=="Enter") return;
  const s=session,a=s.ans[s.i],answered=a&&a.checked;
  const k=e.key.toLowerCase();
  const qq=s.items[s.i]; const keys=qq.type==="tf"?["1","2","v","f"]:["1","2","3","4","a","b","c","d"];
  if(keys.includes(k) && e.target.tagName!=="INPUT"){
    const opts=[...document.querySelectorAll(".opt:not([disabled])")]; let idx="1234".indexOf(k); if(idx<0) idx="abcd".indexOf(k); if(k==="v")idx=0; if(k==="f")idx=1;
    if(opts[idx]){opts[idx].click();opts[idx].focus();}
  }
  if(e.key==="Enter"&&!EXL(s.mode)){ if(e.target.tagName==="BUTTON"&&e.target.dataset.act!=="pick") return; e.preventDefault(); answered?nextQ():check(); }
});

/* Tema claro/oscuro */
const TK="hidroelec-theme";
