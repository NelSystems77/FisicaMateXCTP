<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#2B6CB0">
<title>Hidrostática y Corriente — Décimo CTP</title>
<meta name="description" content="Práctica interactiva para Décimo año (CTP Vázquez de Coronado): densidad, presión, presión en el interior de un líquido e intensidad de corriente eléctrica I = Q/t. Alineada con los indicadores y rúbricas del MEP.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF4FB; --bg2:#F6F3FC;
  --surface:#FFFFFF; --surface-alt:#F1F5FB; --line:#DCE5F0;
  --text:#18263A; --text-dim:#4E5F76; --text-faint:#7D8BA0;

  /* Psicología del color: azul = calma y concentración (hidrostática),
     verde-azulado = equilibrio (densidad), ámbar = energía (electricidad),
     violeta = análisis y creatividad (resolución de problemas). */
  --c1:#2B6CB0; --c1-soft:#E4EFFB;
  --c2:#0F8C7E; --c2-soft:#DDF4F0;
  --c3:#B76E00; --c3-soft:#FDF0D8;
  --c4:#6B4FD8; --c4-soft:#ECE8FC;

  --ok:#1C8A50; --ok-soft:#E1F5EA;
  --bad:#C2413B; --bad-soft:#FBE7E5;   /* coral suave: señala el error sin generar ansiedad */
  --warn:#9A6400; --warn-soft:#FFF4DB;

  --water:#7FB8EA; --water-deep:#3E86CF; --glass:#9AAFC6;

  --r-lg:20px; --r-md:14px; --r-sm:10px;
  --shadow:0 2px 12px rgba(24,48,90,.07);
  --shadow-lift:0 14px 40px rgba(24,48,90,.14);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1520; --bg2:#141226;
    --surface:#152131; --surface-alt:#1B2A3D; --line:#2A3B52;
    --text:#EAF1FA; --text-dim:#B0BFD3; --text-faint:#8292A8;
    --c1:#6AA8F0; --c1-soft:#16304F; --c2:#3CC7B5; --c2-soft:#0F332F;
    --c3:#F2B04A; --c3-soft:#3A2A0C; --c4:#A893FF; --c4-soft:#272050;
    --ok:#4FD08A; --ok-soft:#113524; --bad:#FF8A80; --bad-soft:#3E1A1A;
    --warn:#F5C063; --warn-soft:#3A2C0D;
    --water:#2F6BA8; --water-deep:#5C9DE0; --glass:#5C7090;
    --shadow:0 2px 12px rgba(0,0,0,.35); --shadow-lift:0 14px 40px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  --bg:#0D1520; --bg2:#141226;
  --surface:#152131; --surface-alt:#1B2A3D; --line:#2A3B52;
  --text:#EAF1FA; --text-dim:#B0BFD3; --text-faint:#8292A8;
  --c1:#6AA8F0; --c1-soft:#16304F; --c2:#3CC7B5; --c2-soft:#0F332F;
  --c3:#F2B04A; --c3-soft:#3A2A0C; --c4:#A893FF; --c4-soft:#272050;
  --ok:#4FD08A; --ok-soft:#113524; --bad:#FF8A80; --bad-soft:#3E1A1A;
  --warn:#F5C063; --warn-soft:#3A2C0D;
  --water:#2F6BA8; --water-deep:#5C9DE0; --glass:#5C7090;
  --shadow:0 2px 12px rgba(0,0,0,.35); --shadow-lift:0 14px 40px rgba(0,0,0,.5);
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; color:var(--text);
  background:linear-gradient(160deg,var(--bg) 0%,var(--bg2) 100%) fixed;
  background-color:var(--bg);
  font-family:"Nunito",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  line-height:1.55; min-height:100dvh; font-size:1rem;
}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--c1);outline-offset:2px;border-radius:6px}
.skip{position:absolute;left:-999px;top:0;background:var(--c1);color:#fff;padding:10px 16px;z-index:300;border-radius:0 0 10px 0}
.skip:focus{left:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

#app{max-width:820px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:12px;
  padding:12px 16px;background:color-mix(in srgb,var(--surface) 88%,transparent);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.logo{width:40px;height:40px;border-radius:12px;flex:none;display:grid;place-items:center;font-size:20px;
  background:linear-gradient(135deg,var(--c1),var(--c4));box-shadow:0 4px 14px color-mix(in srgb,var(--c1) 35%,transparent)}
.brand{flex:1;min-width:0}
.brand b{display:block;font-size:1rem;font-weight:900;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{display:block;font-size:.74rem;color:var(--text-faint);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{background:var(--surface-alt);border:1px solid var(--line);border-radius:12px;min-width:40px;height:40px;
  cursor:pointer;font-size:1rem;display:inline-grid;place-items:center;padding:0 10px;font-weight:800;color:var(--text-dim)}
.icon-btn:hover{border-color:var(--c1)}

main{flex:1;padding:18px 16px 110px}
.view{animation:fade .28s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

h1,h2,h3{letter-spacing:-.015em;line-height:1.25}
h2{font-size:1.35rem;margin:0 0 6px;font-weight:900}
h3{font-size:1.06rem;margin:0 0 8px;font-weight:800}
p{margin:0 0 10px;color:var(--text-dim)}
.lede{font-size:.98rem}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px;margin-bottom:14px;box-shadow:var(--shadow)}
.hero{position:relative;overflow:hidden;color:#fff;border:none;
  background:linear-gradient(135deg,#1F5FA8 0%,#2F7FC9 45%,#6B4FD8 100%)}
.hero p{color:rgba(255,255,255,.9)}
.hero h2{font-size:1.5rem}
.hero .tag{display:inline-block;background:rgba(255,255,255,.18);border-radius:999px;padding:3px 10px;font-size:.75rem;font-weight:800;margin-bottom:10px}
.bubbles{position:absolute;inset:0;pointer-events:none}
.bubbles span{position:absolute;bottom:-20px;border-radius:50%;background:rgba(255,255,255,.18);animation:rise linear infinite}
@keyframes rise{to{transform:translateY(-260px);opacity:0}}

.grid{display:grid;gap:12px}
@media(min-width:620px){.grid.two{grid-template-columns:1fr 1fr}}

.ind-card{display:flex;flex-direction:column;gap:10px;border-left:6px solid var(--ic);cursor:default}
.ind-head{display:flex;gap:12px;align-items:flex-start}
.ind-ico{width:46px;height:46px;border-radius:14px;flex:none;display:grid;place-items:center;font-size:22px;background:var(--ics)}
.ind-head .k{font-size:.72rem;font-weight:900;color:var(--ic);text-transform:uppercase;letter-spacing:.05em}
.ind-head .n{font-weight:900;font-size:1.02rem}
.ind-head .c{font-size:.82rem;color:var(--text-faint);font-weight:700}
.bar{background:var(--surface-alt);border-radius:999px;height:10px;overflow:hidden}
.bar>i{display:block;height:100%;border-radius:999px;background:var(--ic,var(--c1));transition:width .45s ease}
.bar-row{display:flex;gap:10px;align-items:center;font-size:.78rem;font-weight:800;color:var(--text-dim)}
.bar-row .bar{flex:1}

.btn{border:1px solid transparent;border-radius:var(--r-md);padding:11px 16px;font-weight:800;font-size:.92rem;cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;text-decoration:none;transition:transform .12s ease,filter .12s ease}
.btn:active{transform:scale(.98)}
.btn-p{background:var(--c1);color:#fff}
:root[data-theme="dark"] .btn-p{color:#0D1520}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn-p{color:#0D1520}}
.btn-p:hover{filter:brightness(1.07)}
.btn-g{background:var(--surface-alt);border-color:var(--line);color:var(--text)}
.btn-g:hover{border-color:var(--c1)}
.btn-row{display:flex;gap:10px;flex-wrap:wrap}
.btn-row .btn{flex:1 1 140px}
.btn[disabled]{opacity:.5;cursor:not-allowed}

.chip{display:inline-flex;align-items:center;gap:6px;font-size:.74rem;font-weight:800;border-radius:999px;padding:4px 10px;background:var(--surface-alt);color:var(--text-dim);border:1px solid var(--line)}
.chip.l1{background:var(--c1-soft);color:var(--c1);border-color:transparent}
.chip.l2{background:var(--c2-soft);color:var(--c2);border-color:transparent}
.chip.l3{background:var(--c4-soft);color:var(--c4);border-color:transparent}

/* nav */
.tabbar{position:fixed;bottom:0;left:0;right:0;z-index:50;display:flex;justify-content:center;
  background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
.tabbar nav{display:flex;gap:4px;max-width:820px;width:100%}
.tab{flex:1;background:none;border:none;border-radius:12px;padding:6px 2px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px;
  font-size:.7rem;font-weight:800;color:var(--text-faint);min-height:52px}
.tab .e{font-size:1.25rem;line-height:1.2}
.tab[aria-current="page"]{background:var(--c1-soft);color:var(--c1)}

/* lesson */
.seg{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px;scrollbar-width:thin}
.seg button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:800;font-size:.85rem;cursor:pointer;color:var(--text-dim)}
.seg button[aria-selected="true"]{background:var(--ic,var(--c1));color:#fff;border-color:transparent}
:root[data-theme="dark"] .seg button[aria-selected="true"]{color:#0D1520}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .seg button[aria-selected="true"]{color:#0D1520}}
.formula{font-family:"Cambria Math","Times New Roman",serif;font-size:1.35rem;font-weight:700;text-align:center;padding:14px;border-radius:var(--r-md);
  background:var(--ics,var(--c1-soft));color:var(--ic,var(--c1));margin:8px 0}
.formula small{display:block;font-family:"Nunito",sans-serif;font-size:.78rem;font-weight:700;color:var(--text-dim);margin-top:4px}
.key{list-style:none;padding:0;margin:0;display:grid;gap:8px}
.key li{padding:10px 12px;border-radius:var(--r-sm);background:var(--surface-alt);font-size:.93rem;color:var(--text-dim)}
.key li b{color:var(--text)}
table{width:100%;border-collapse:collapse;font-size:.88rem}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:.74rem;text-transform:uppercase;letter-spacing:.04em;color:var(--text-faint)}
.tbl-wrap{overflow-x:auto}
.callout{border-radius:var(--r-md);padding:12px 14px;font-size:.92rem;margin:10px 0}
.callout.warn{background:var(--warn-soft);color:var(--text)}
.callout.info{background:var(--c1-soft);color:var(--text)}
.steps{margin:6px 0 0;padding-left:20px;color:var(--text-dim);font-size:.93rem}
.steps li{margin-bottom:4px}

/* sims */
.sim{display:grid;gap:12px}
@media(min-width:620px){.sim{grid-template-columns:1.1fr 1fr;align-items:center}}
.sim svg{width:100%;height:auto;display:block}
.ctrl{display:grid;gap:4px;margin-bottom:10px}
.ctrl label{font-size:.82rem;font-weight:800;color:var(--text-dim);display:flex;justify-content:space-between}
input[type=range]{width:100%;accent-color:var(--ic,var(--c1))}
select{background:var(--surface-alt);border:1px solid var(--line);border-radius:10px;padding:8px 10px;width:100%}
.readout{background:var(--surface-alt);border-radius:var(--r-md);padding:12px;font-weight:800;font-size:.95rem}
.readout .big{font-size:1.3rem;color:var(--ic,var(--c1))}

/* svg classes */
.w{fill:var(--water)} .wd{fill:var(--water-deep)} .gl{fill:none;stroke:var(--glass);stroke-width:3}
.ink{fill:var(--text)} .inkd{fill:var(--text-dim)} .ln{stroke:var(--text-dim);fill:none;stroke-width:2}
.lnf{stroke:var(--text-faint);fill:none;stroke-width:1.5;stroke-dasharray:5 4}
.ac1{stroke:var(--c1)} .ac3{stroke:var(--c3)} .ac4{stroke:var(--c4)} .fc1{fill:var(--c1)} .fc3{fill:var(--c3)} .fc4{fill:var(--c4)} .fc2{fill:var(--c2)}
.svgt{font:700 13px Nunito,sans-serif;fill:var(--text-dim)}
.svgtb{font:900 14px Nunito,sans-serif;fill:var(--text)}

/* quiz */
.qtop{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.qtop .bar{flex:1}
.qtop .cnt{font-size:.8rem;font-weight:900;color:var(--text-dim);min-width:48px;text-align:right}
.qmeta{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.qtext{font-size:1.06rem;font-weight:700;color:var(--text);margin-bottom:12px}
.qtext .data{display:block;font-weight:600;color:var(--text-dim);font-size:.92rem;margin-top:6px}
.fig{background:var(--surface-alt);border-radius:var(--r-md);padding:10px;margin-bottom:12px}
.fig svg{width:100%;max-height:260px;display:block}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:var(--surface);border:2px solid var(--line);border-radius:var(--r-md);
  padding:12px 14px;cursor:pointer;font-weight:700;font-size:.97rem;transition:border-color .15s, background .15s}
.opt:hover:not([disabled]){border-color:var(--c1);background:var(--c1-soft)}
.opt .lt{flex:none;width:28px;height:28px;border-radius:9px;display:grid;place-items:center;background:var(--surface-alt);font-weight:900;font-size:.85rem;color:var(--text-dim)}
.opt.sel{border-color:var(--c1);background:var(--c1-soft)}
.opt.sel .lt{background:var(--c1);color:#fff}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .lt{background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .lt{background:var(--bad);color:#fff}
.opt[disabled]{cursor:default}
.numrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.numrow input{flex:1 1 180px;min-width:0;border:2px solid var(--line);background:var(--surface);border-radius:var(--r-md);padding:12px 14px;font-size:1.05rem;font-weight:800}
.numrow input:focus{border-color:var(--c1);outline:none}
.numrow .unit{font-weight:900;color:var(--text-dim);background:var(--surface-alt);border-radius:10px;padding:10px 12px}
.hint-note{font-size:.78rem;color:var(--text-faint);margin-top:6px}
.fb{border-radius:var(--r-md);padding:14px 16px;margin-top:14px;animation:fade .25s ease}
.fb.ok{background:var(--ok-soft);border:1px solid color-mix(in srgb,var(--ok) 35%,transparent)}
.fb.bad{background:var(--bad-soft);border:1px solid color-mix(in srgb,var(--bad) 35%,transparent)}
.fb .ttl{font-weight:900;font-size:1rem;margin-bottom:4px}
.fb.ok .ttl{color:var(--ok)} .fb.bad .ttl{color:var(--bad)}
.fb p{color:var(--text);margin-bottom:6px;font-size:.94rem}
.fb .sol{background:color-mix(in srgb,var(--surface) 70%,transparent);border-radius:10px;padding:10px 12px;margin-top:8px}
.fb .sol b{font-size:.8rem;text-transform:uppercase;letter-spacing:.04em;color:var(--text-faint)}
.hintbox{background:var(--warn-soft);border-radius:var(--r-md);padding:10px 14px;margin-top:10px;font-size:.92rem}
.palette{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}
.palette button{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:900;font-size:.8rem;cursor:pointer;color:var(--text-dim)}
.palette button.done{background:var(--c1-soft);color:var(--c1);border-color:transparent}
.palette button.cur{outline:3px solid var(--c1);outline-offset:1px}
.palette button.r{background:var(--ok-soft);color:var(--ok)}
.palette button.x{background:var(--bad-soft);color:var(--bad)}

/* results */
.score-ring{display:grid;place-items:center;margin:6px auto 12px;width:150px;height:150px;border-radius:50%;
  background:conic-gradient(var(--ring,var(--c1)) calc(var(--p)*1%),var(--surface-alt) 0)}
.score-ring>div{width:118px;height:118px;border-radius:50%;background:var(--surface);display:grid;place-items:center;text-align:center}
.score-ring b{font-size:2rem;font-weight:900;line-height:1}
.score-ring small{font-size:.75rem;color:var(--text-faint);font-weight:800}
.lvl-pill{display:inline-block;white-space:nowrap;font-weight:900;border-radius:999px;padding:3px 10px;font-size:.78rem}
.lvl-0{background:var(--bad-soft);color:var(--bad)}
.lvl-1{background:var(--warn-soft);color:var(--warn)}
.lvl-2{background:var(--c1-soft);color:var(--c1)}
.lvl-3{background:var(--ok-soft);color:var(--ok)}
.rubric td:first-child{font-weight:800;color:var(--text)}
.audit-ok{color:var(--ok);font-weight:900}
.audit-no{color:var(--bad);font-weight:900}

/* modal */
dialog{border:none;border-radius:var(--r-lg);padding:0;max-width:min(680px,calc(100vw - 24px));width:100%;background:var(--surface);color:var(--text);box-shadow:var(--shadow-lift)}
dialog::backdrop{background:rgba(10,20,40,.5)}
.dlg-h{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface)}
.dlg-b{padding:16px 18px;max-height:70vh;overflow:auto}

.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--text);color:var(--surface);padding:10px 16px;border-radius:12px;font-weight:800;font-size:.9rem;z-index:100;animation:fade .2s ease}
html.big{font-size:118%}
.kbds{display:flex;flex-wrap:wrap;gap:5px;align-items:center;margin:6px 0}
kbd{font:800 .88rem "Nunito",system-ui,sans-serif;background:var(--surface);border:1px solid var(--line);border-bottom-width:3px;border-radius:8px;padding:3px 9px;color:var(--text);min-width:30px;text-align:center}
kbd.n{background:var(--surface-alt);font-weight:700}
kbd.sp{background:var(--c3-soft);color:var(--c3);border-color:transparent}
.lcd{background:#CFDCC4;color:#1D2A16;border-radius:10px;padding:8px 14px;font:700 1.1rem "Courier New",monospace;text-align:right;border:2px solid #AAB9A0;margin:8px 0}
.lcd small{display:block;text-align:left;font:700 .72rem "Nunito",sans-serif;opacity:.75}
textarea{width:100%;min-height:96px;border:2px solid var(--line);background:var(--surface);border-radius:var(--r-md);padding:12px 14px;font:inherit;font-weight:600;resize:vertical;color:var(--text)}
textarea:focus,.search:focus{border-color:var(--c1);outline:none}
.search{width:100%;border:2px solid var(--line);background:var(--surface);border-radius:var(--r-md);padding:10px 14px;font-weight:700}
.ex-chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.ex-chips button{border:1px dashed var(--line);background:var(--surface-alt);border-radius:999px;padding:6px 12px;font-size:.8rem;font-weight:700;cursor:pointer;color:var(--text-dim)}
.decode{border-radius:var(--r-md);padding:14px;margin-top:12px;background:var(--surface-alt);border-left:5px solid var(--dc,var(--c1));animation:fade .25s ease}
.decode .row{margin:0 0 8px;color:var(--text);font-size:.93rem}
.decode .row b.lbl{display:block;font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;color:var(--text-faint)}
.decode .f{font-family:"Cambria Math","Times New Roman",serif;font-size:1.25rem;font-weight:700;color:var(--dc,var(--c1))}
.dchip{display:inline-block;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:2px 8px;margin:2px 4px 2px 0;font-weight:800;font-size:.85rem}
.dchip.cv{background:var(--warn-soft);border-color:transparent}
.gcard{border-left:5px solid var(--gc);padding:0;overflow:hidden}
.gcard summary{list-style:none;cursor:pointer;padding:14px 16px;display:flex;gap:10px;align-items:flex-start}
.gcard summary::-webkit-details-marker{display:none}
.gcard summary .q{flex:1;font-weight:800}
.gcard summary .q small{display:block;font-weight:700;color:var(--text-faint);font-size:.8rem;margin-top:2px}
.gcard summary .fm{font-family:"Cambria Math","Times New Roman",serif;font-weight:700;color:var(--gc);white-space:nowrap}
.gcard .gb{padding:0 16px 16px}
.gcard[open] summary{border-bottom:1px solid var(--line);margin-bottom:12px}
.flow{display:grid;gap:8px}
.flow>div{background:var(--surface-alt);border-radius:12px;padding:10px 12px;font-size:.92rem;color:var(--text)}
.flow>div>b{display:block;font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;color:var(--text-faint);margin-bottom:2px}
.calm{display:flex;gap:16px;align-items:center}
.breath{flex:none;width:64px;height:64px;border-radius:50%;background:radial-gradient(circle,var(--c2) 0%,var(--c2-soft) 70%);animation:breath 8s ease-in-out infinite}
@keyframes breath{0%,100%{transform:scale(.7);opacity:.7}50%{transform:scale(1.05);opacity:1}}
.station{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:12px 14px;cursor:pointer;margin-bottom:10px;box-shadow:var(--shadow)}
.station:hover{border-color:var(--c2)}
.station .num{flex:none;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:20px;background:var(--c2-soft)}
.station.ok .num{background:var(--ok-soft)}
.station .tt{flex:1;min-width:0;font-weight:800}
.station .tt small{display:block;font-weight:700;color:var(--text-faint);font-size:.78rem}
.simple{background:linear-gradient(135deg,var(--c2-soft),var(--surface));border:1px solid color-mix(in srgb,var(--c2) 30%,transparent)}
.simple .big-ico{font-size:2.2rem;line-height:1;margin-bottom:6px}
.dfsr{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:8px}
.dfsr div{background:var(--surface-alt);border-radius:12px;padding:10px 6px;text-align:center;font-size:.78rem;font-weight:700;color:var(--text-dim)}
.dfsr b{display:block;font-size:1.3rem;color:var(--c2)}
.retry{border-radius:var(--r-md);padding:14px 16px;margin-top:14px;background:var(--warn-soft);border:1px solid color-mix(in srgb,var(--warn) 35%,transparent);animation:fade .25s ease}
.retry .ttl{font-weight:900;color:var(--warn);margin-bottom:4px}
.retry p{color:var(--text);margin-bottom:4px;font-size:.94rem}
.stepbox{background:var(--c2-soft);border-radius:var(--r-md);padding:10px 14px;margin-top:10px;font-size:.93rem}
.stepbox ol{margin:4px 0 0;padding-left:20px}
.tri svg{max-width:150px;display:block;margin:0 auto}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none !important;transition:none !important}
}
@media print{.tabbar,.topbar{display:none} main{padding:0}}

{id:"h08",ind:1,lvl:1,type:"tf",tags:["hidro","dens"],
 q:"Un objeto flota en el agua si su densidad es mayor que la del agua.",
 a:false, ex:"Falso. Flota si su densidad es MENOR que la del líquido (por ejemplo, el aceite y la madera en agua). Si es mayor, se hunde (por ejemplo, el hierro)."},
{id:"h09",ind:1,lvl:2,type:"mc",tags:["pres","ctx"],
 q:"¿Por qué un cuchillo afilado corta mejor que uno sin filo si se aplica la misma fuerza?",
 opts:[["Porque el filo tiene menor área de contacto y eso aumenta la presión.","¡Exacto! Con la misma F y menor A, P = F/A es mayor."],
  ["Porque al afilarlo aumenta la fuerza que se aplica.","La fuerza es la misma en ambos casos; lo que cambia es el área."],
  ["Porque el filo tiene mayor área de contacto.","Al afilarlo el área disminuye, no aumenta."],
  ["Porque al afilarlo aumenta la densidad del metal.","Afilar no cambia la densidad del material."]],
 ex:"P = F/A: si el área se reduce, la presión aumenta. Por eso funcionan los clavos, las agujas y los cuchillos."},
{id:"h10",ind:1,lvl:2,type:"mc",tags:["pres","ctx"],
 q:"Las raquetas para caminar sobre la nieve y las llantas anchas de un tractor tienen la misma función física. ¿Cuál es?",
 opts:[["Aumentar el área de contacto para disminuir la presión sobre el suelo.","Correcto: más área → menos presión → no se hunden."],
  ["Aumentar la presión para sujetarse mejor.","Más presión haría que se hundieran más."],
  ["Disminuir el peso del cuerpo o del vehículo.","El peso (la fuerza) no cambia; lo que cambia es cómo se reparte."],
  ["Aumentar la densidad del suelo.","El calzado o las llantas no modifican la densidad del suelo."]],
 ex:"Al repartir el mismo peso en un área mayor, la presión baja y el objeto no se hunde."},
{id:"h11",ind:1,lvl:2,type:"mc",tags:["pliq","ctx"],
 q:"Las represas se construyen mucho más gruesas en la base que en la parte superior. ¿Por qué?",
 opts:[["Porque la presión del agua aumenta con la profundidad.","¡Correcto! P = ρgh: a mayor h, mayor presión sobre el muro."],
  ["Porque el agua de arriba es más densa.","La densidad del agua es prácticamente la misma en toda la represa."],
  ["Solo por estética y tradición constructiva.","Hay una razón física: la presión crece con la profundidad."],
  ["Porque la presión es igual en todos los puntos del muro.","La presión no es igual: aumenta conforme aumenta la profundidad."]],
 ex:"Como P = ρgh, el fondo de la represa soporta la mayor presión; por eso necesita más espesor allí."},
{id:"h12",ind:1,lvl:2,type:"mc",tags:["dens","ctx"],
 q:"El hielo flota sobre el agua líquida. Esto se debe a que…",
 opts:[["El hielo es menos denso que el agua líquida.","Correcto: ρ(hielo) ≈ 0,92 g/cm³ < ρ(agua) = 1,0 g/cm³."],
  ["El hielo tiene más masa que el agua.","Lo que decide si flota no es la masa, sino la densidad."],
  ["El hielo es más denso que el agua.","Si fuera más denso, se hundiría."],
  ["El hielo no tiene peso.","Todo cuerpo con masa tiene peso."]],
 ex:"Un cuerpo flota en un líquido si su densidad es menor que la del líquido. Al congelarse, el agua se expande y su densidad disminuye."},
{id:"h13",ind:1,lvl:2,type:"mc",tags:["pliq","rep"],fig:"botella",
 q:"Un recipiente con agua tiene tres agujeros A, B y C a distintas alturas. ¿De cuál sale el chorro con mayor alcance?",
 opts:[["Del agujero C, el más bajo, porque allí la presión es mayor.","¡Bien! C está a mayor profundidad, así que soporta más presión y el agua sale con más fuerza."],
  ["Del agujero A, el más alto.","A está cerca de la superficie: tiene la menor profundidad y la menor presión."],
  ["Del agujero B, porque está en el medio.","B tiene una presión intermedia, no la máxima."],
  ["Los tres tienen el mismo alcance.","La presión es distinta en cada agujero porque cambia la profundidad."]],
 ex:"Esta representación muestra que la presión aumenta con la profundidad (P = ρgh)."},
{id:"h14",ind:1,lvl:3,type:"mc",tags:["pliq","rep"],fig:"paradoja",
 q:"Los tres recipientes contienen el mismo líquido hasta la misma altura h. ¿En cuál es mayor la presión hidrostática en el fondo?",
 opts:[["Es igual en los tres.","¡Correcto! Es la paradoja hidrostática: la presión depende de h, no de la forma ni del volumen."],
  ["En el 1, porque tiene más líquido.","Tener más volumen no aumenta la presión en el fondo."],
  ["En el 2, porque es el más angosto.","Que el recipiente sea angosto no cambia ρ, g ni h."],
  ["En el 3, porque su forma es cónica.","La forma no aparece en P = ρgh."]],
 ex:"Con el mismo líquido (mismo ρ) y la misma altura h, la presión en el fondo es la misma: P = ρgh."},
{id:"h15",ind:1,lvl:3,type:"mc",tags:["pliq","dens"],
 q:"Se comparan dos puntos a 50 cm de profundidad: uno en agua (1000 kg/m³) y otro en mercurio (13 600 kg/m³). ¿Qué se concluye sobre la presión hidrostática?",
 opts:[["En el mercurio es 13,6 veces mayor.","¡Exacto! Con la misma g y h, la presión es proporcional a ρ: 13 600/1000 = 13,6."],
  ["Es igual, porque la profundidad es la misma.","Además de la profundidad, la presión depende de la densidad del líquido."],
  ["En el agua es mayor, porque el agua es más común.","Gana el líquido más denso, que es el mercurio."],
  ["En el mercurio es 13 600 veces mayor.","La razón es 13 600 ÷ 1000 = 13,6, no 13 600."]],
 ex:"P = ρgh. Si g y h son iguales, la presión es directamente proporcional a la densidad."},
{id:"h16",ind:1,lvl:3,type:"mc",tags:["pliq","patm"],
 q:"Un buzo desciende de 5 m a 10 m de profundidad. ¿Qué pasa con la presión hidrostática (sin contar la atmosférica)?",
 opts:[["Se duplica.","¡Correcto! P = ρgh es directamente proporcional a h: el doble de h da el doble de P."],
  ["Se reduce a la mitad.","Al bajar más, la presión aumenta, no disminuye."],
  ["Se multiplica por cuatro.","La relación es lineal (h), no cuadrática."],
  ["No cambia.","Sí cambia, porque cambia la profundidad."]],
 ex:"Ojo: la presión ABSOLUTA (P₀ + ρgh) no se duplica, porque la presión atmosférica P₀ se mantiene constante."},
{id:"h17",ind:1,lvl:3,type:"mc",tags:["hidro","rep"],fig:"vasos",
 q:"Se vierte agua en un sistema de vasos comunicantes con tubos de distintas formas. Al llegar al equilibrio…",
 opts:[["El agua alcanza el mismo nivel en todos los tubos.","¡Correcto! A una misma altura, la presión debe ser igual en todo el líquido en reposo."],
  ["El agua sube más en el tubo más angosto.","La forma o el grosor no cambian el nivel de equilibrio."],
  ["El agua sube más en el tubo más ancho.","Todos los tubos quedan al mismo nivel."],
  ["Cada tubo queda a un nivel diferente según su forma.","Para un mismo líquido en reposo, el nivel es igual en todos."]],
 ex:"Principio de los vasos comunicantes: un mismo líquido en reposo alcanza la misma altura en todos los recipientes conectados."},
{id:"h18",ind:1,lvl:3,type:"mc",tags:["dens"],
 q:"Un bloque de madera de densidad 0,6 g/cm³ se corta por la mitad. ¿Cuál es la densidad de cada mitad?",
 opts:[["0,6 g/cm³.","¡Correcto! La masa y el volumen se reducen a la mitad, así que el cociente no cambia."],
  ["0,3 g/cm³.","Si se divide la masa entre dos, también se divide el volumen: la densidad se mantiene."],
  ["1,2 g/cm³.","La densidad no se duplica al cortar el bloque."],
  ["Depende del tamaño del corte.","La densidad es una propiedad intensiva: no depende de la cantidad de materia."]],
 ex:"La densidad es una propiedad característica (intensiva): no depende del tamaño de la muestra."},
{id:"h19",ind:1,lvl:3,type:"mc",tags:["pres","rep"],fig:"ladrillo",
 q:"El mismo ladrillo se apoya de tres formas. ¿En qué posición ejerce MAYOR presión sobre el suelo?",
 opts:[["En la 3 (de pie), porque se apoya en la cara de menor área.","¡Correcto! El peso (F) es el mismo; con el área menor, la presión es mayor."],
  ["En la 1 (acostado), porque se apoya en la cara de mayor área.","Más área significa menos presión."],
  ["Es igual en las tres, porque el peso no cambia.","El peso no cambia, pero el área sí, y P = F/A."],
  ["En la 2, porque es la posición intermedia.","La presión máxima se da con el área mínima (posición 3)."]],
 ex:"Con la fuerza constante, la presión es inversamente proporcional al área de apoyo."},
{id:"h20",ind:1,lvl:3,type:"mc",tags:["pliq","rep","hidro"],fig:"tanqueAB",
 q:"En el tanque, A y B están a 1 m de profundidad y C a 3 m. ¿Cuál afirmación es correcta?",
 opts:[["P(A) = P(B) < P(C).","¡Correcto! A y B están a la misma profundidad; C está más abajo y soporta más presión."],
  ["P(A) > P(B), porque A está junto a la pared.","Estar cerca de la pared no importa: solo cuenta la profundidad."],
  ["P(A) = P(B) = P(C).","C está a mayor profundidad, así que su presión es mayor."],
  ["P(C) < P(A), porque C está en el fondo.","Es al revés: en el fondo la presión es mayor."]],
 ex:"Todos los puntos a la misma profundidad de un mismo líquido en reposo tienen la misma presión."},
{id:"h21",ind:1,lvl:3,type:"mc",tags:["patm","pliq"],
 q:"¿Por qué la presión absoluta en el fondo de una piscina es mayor que la presión calculada solo con ρ·g·h?",
 opts:[["Porque a la presión del líquido se le suma la presión atmosférica que actúa sobre la superficie.","¡Exacto! P_abs = P₀ + ρgh."],
  ["Porque el agua del fondo es mucho más densa.","El agua es prácticamente incompresible: su densidad casi no cambia."],
  ["Porque la gravedad es mayor en el fondo.","g se considera constante (9,8 m/s²)."],
  ["Porque ρgh solo es válido para el mercurio.","ρgh es válido para cualquier líquido en reposo."]],
 ex:"Presión absoluta = presión atmosférica + presión hidrostática."},
{id:"h22",ind:1,lvl:2,type:"num",tags:["pres"],
 q:"Una caja ejerce una fuerza de 500 N sobre un área de 0,25 m². Calcule la presión.",
 ans:2000,unit:"Pa",sol:["P = F / A","P = 500 N ÷ 0,25 m²","P = 2000 Pa"],
 errs:[[125,"Multiplicaste F × A. La presión es F ÷ A."],[0.0005,"Invertiste la fórmula: es F/A, no A/F."]],
 hint:"Usa P = F / A."},
{id:"h23",ind:1,lvl:2,type:"num",tags:["pres","unid"],
 q:"Un bloque que pesa 50 N se apoya sobre una cara de 25 cm². Calcule la presión en pascales.",
 ans:20000,unit:"Pa",sol:["Convertir el área: 25 cm² = 25 ÷ 10 000 = 0,0025 m²","P = F / A = 50 N ÷ 0,0025 m²","P = 20 000 Pa"],
 errs:[[2,"Usaste 25 cm² sin convertir. 1 m² = 10 000 cm², así que 25 cm² = 0,0025 m²."],[200,"Dividiste entre 100 en vez de entre 10 000: el área está al cuadrado."]],
 hint:"Primero convierte cm² a m²: divide entre 10 000."},
{id:"h24",ind:1,lvl:2,type:"num",tags:["pliq","ctx"],
 q:"Calcule la presión hidrostática a 3 m de profundidad en una piscina.",data:"ρ(agua) = 1000 kg/m³ · g = 9,8 m/s²",
 ans:29400,unit:"Pa",sol:["P = ρ·g·h","P = 1000 × 9,8 × 3","P = 29 400 Pa"],
 errs:[[3000,"Te faltó multiplicar por g = 9,8 m/s²."]],hint:"P = ρ · g · h"},
{id:"h25",ind:1,lvl:3,type:"num",tags:["patm","pliq","ctx"],
 q:"Un buzo está a 5 m de profundidad en el mar. Calcule la presión ABSOLUTA que soporta.",data:"ρ(agua de mar) = 1030 kg/m³ · g = 9,8 m/s² · P₀ = 101 300 Pa",
 ans:151770,unit:"Pa",sol:["Presión hidrostática: ρgh = 1030 × 9,8 × 5 = 50 470 Pa","P_abs = P₀ + ρgh = 101 300 + 50 470","P_abs = 151 770 Pa"],
 errs:[[50470,"Esa es solo la presión hidrostática. La absoluta suma la atmosférica: P₀ + ρgh."],[150300,"Usaste la densidad del agua dulce (1000); el agua de mar es de 1030 kg/m³."]],
 hint:"P_abs = P₀ + ρgh"},
{id:"h26",ind:1,lvl:3,type:"num",tags:["pliq"],
 q:"Un sensor en un tanque de agua marca una presión hidrostática de 39 200 Pa. ¿A qué profundidad está?",data:"ρ = 1000 kg/m³ · g = 9,8 m/s²",
 ans:4,unit:"m",sol:["Despejar h: h = P / (ρ·g)","h = 39 200 ÷ (1000 × 9,8) = 39 200 ÷ 9800","h = 4 m"],
 errs:[[384160000,"Multiplicaste. Para despejar h hay que dividir: h = P/(ρg)."],[39.2,"Te faltó dividir también entre g = 9,8."]],
 hint:"Despeja h de P = ρgh."},
{id:"h27",ind:1,lvl:3,type:"num",tags:["pliq","dens"],tol:0.02,
 q:"A 1,5 m de profundidad en un líquido desconocido, la presión hidrostática es de 12 000 Pa. Calcule la densidad del líquido.",data:"g = 9,8 m/s²",
 ans:816.33,unit:"kg/m³",sol:["Despejar ρ: ρ = P / (g·h)","ρ = 12 000 ÷ (9,8 × 1,5) = 12 000 ÷ 14,7","ρ ≈ 816,3 kg/m³ (similar al alcohol)"],
 errs:[[8000,"Te faltó dividir entre g = 9,8."]],hint:"ρ = P / (g · h)"},
{id:"h28",ind:1,lvl:2,type:"num",tags:["pres","ctx"],
 q:"Una persona de 600 N está de pie. El área total de las suelas de sus dos zapatos es 0,04 m². ¿Qué presión ejerce sobre el piso?",
 ans:15000,unit:"Pa",sol:["P = F / A","P = 600 ÷ 0,04","P = 15 000 Pa"],
 errs:[[24,"Multiplicaste F × A; hay que dividir."],[30000,"Ese sería el resultado apoyándose en un solo pie (área de 0,02 m²)."]],hint:"La fuerza es el peso."},
{id:"h29",ind:1,lvl:3,type:"num",tags:["pres","ctx"],
 q:"La misma persona (600 N, con 0,04 m² entre ambos zapatos) se para en un solo pie. ¿Cuál es la nueva presión?",
 ans:30000,unit:"Pa",sol:["Un solo pie: A = 0,04 ÷ 2 = 0,02 m²","P = 600 ÷ 0,02 = 30 000 Pa","Con la mitad del área, la presión se duplica."],
 errs:[[15000,"Esa es la presión con los dos pies. Con un pie el área se reduce a la mitad."],[7500,"Si el área disminuye, la presión aumenta, no disminuye."]],hint:"El área se reduce a la mitad."},
{id:"h30",ind:1,lvl:2,type:"num",tags:["pres"],
 q:"Un líquido ejerce una presión de 2,5 × 10⁵ Pa sobre una tapa de 0,02 m². ¿Qué fuerza ejerce sobre la tapa?",
 ans:5000,unit:"N",sol:["Despejar F: F = P·A","F = 250 000 × 0,02","F = 5000 N"],
 errs:[[12500000,"Dividiste P entre A; para obtener F se multiplica: F = P·A."]],hint:"F = P · A"},
{id:"h31",ind:1,lvl:3,type:"num",tags:["pliq","unid"],
 q:"Un vaso tiene 12 cm de alcohol. Calcule la presión hidrostática en el fondo.",data:"ρ(alcohol) = 790 kg/m³ · g = 9,8 m/s²",
 ans:929.04,unit:"Pa",sol:["Convertir: h = 12 cm = 0,12 m","P = ρgh = 790 × 9,8 × 0,12","P ≈ 929 Pa"],
 errs:[[92904,"Usaste h = 12 sin convertir: 12 cm = 0,12 m."]],hint:"La altura debe estar en metros."},

/* ---------------- INDICADOR 2 · RELACIONA ---------------- */
{id:"d01",ind:2,lvl:1,type:"mc",tags:["form"],
 q:"¿Cuál es la fórmula de la densidad?",
 opts:[["ρ = m / V","¡Correcto! Masa entre volumen."],["ρ = V / m","Está invertida: la masa va en el numerador."],["ρ = m · V","La densidad es un cociente, no un producto."],["ρ = F / A","Esa es la fórmula de la presión."]],
 ex:"ρ (rho) = m/V. Unidades: kg/m³ (SI) o g/cm³."},
{id:"d02",ind:2,lvl:1,type:"mc",tags:["desm"],
 q:"Si conoces la densidad y el volumen, ¿cuál es el despeje correcto para la masa?",
 opts:[["m = ρ · V","¡Bien! Al pasar V a multiplicar, queda m = ρV."],["m = ρ / V","V está dividiendo a m, así que pasa al otro lado multiplicando."],["m = V / ρ","Esa expresión es el despeje del volumen invertido."],["m = ρ + V","Las magnitudes no se suman en este despeje."]],
 ex:"De ρ = m/V → multiplica ambos lados por V → m = ρV."},
{id:"d03",ind:2,lvl:1,type:"mc",tags:["desv"],
 q:"¿Cuál es el despeje correcto para el volumen?",
 opts:[["V = m / ρ","¡Correcto!"],["V = ρ / m","Está invertido: la masa va arriba."],["V = m · ρ","Al multiplicar las unidades no darían volumen."],["V = ρ − m","No es una resta."]],
 ex:"De m = ρV → divide entre ρ → V = m/ρ. Truco: triángulo m arriba, ρ y V abajo."},
{id:"d04",ind:2,lvl:1,type:"mc",tags:["unid"],
 q:"¿Cuál es la unidad de densidad en el Sistema Internacional?",
 opts:[["kg/m³","Correcto: kilogramo entre metro cúbico."],["g/cm³","Es muy usada en el laboratorio, pero no es la unidad SI."],["kg·m³","La densidad es masa ENTRE volumen."],["N/m²","Esa es la unidad de presión (Pa)."]],
 ex:"SI: kg/m³. Laboratorio: g/cm³ = g/mL. Equivalencia: 1 g/cm³ = 1000 kg/m³."},
{id:"d05",ind:2,lvl:1,type:"mc",tags:["unid"],
 q:"¿Cuál equivalencia es correcta?",
 opts:[["1 mL = 1 cm³","¡Correcto! Un mililitro ocupa exactamente un centímetro cúbico."],["1 L = 1 m³","1 m³ = 1000 L."],["1 L = 100 cm³","1 L = 1000 cm³."],["1 m³ = 1000 cm³","1 m³ = 1 000 000 cm³ (100³)."]],
 ex:"1 L = 1000 mL = 1000 cm³ = 0,001 m³ · 1 m³ = 1000 L = 1 000 000 cm³."},
{id:"d06",ind:2,lvl:1,type:"mc",tags:["unid"],
 q:"1 g/cm³ equivale a…",
 opts:[["1000 kg/m³","¡Correcto! (1 g/cm³ × 1000 = 1000 kg/m³)."],["1 kg/m³","Falta el factor 1000."],["100 kg/m³","El factor de conversión es 1000, no 100."],["0,001 kg/m³","Al pasar de g/cm³ a kg/m³ se multiplica, no se divide."]],
 ex:"g/cm³ → kg/m³: multiplica por 1000. kg/m³ → g/cm³: divide entre 1000."},
{id:"d07",ind:2,lvl:2,type:"num",tags:["form"],
 q:"Un objeto tiene una masa de 250 g y un volumen de 100 cm³. Calcule su densidad.",
 ans:2.5,unit:"g/cm³",sol:["ρ = m / V","ρ = 250 g ÷ 100 cm³","ρ = 2,5 g/cm³"],
 errs:[[0.4,"Invertiste la fórmula (V/m). La masa va en el numerador."],[25000,"Multiplicaste; la densidad se obtiene dividiendo."]],hint:"ρ = m / V"},
{id:"d08",ind:2,lvl:2,type:"num",tags:["unid"],
 q:"Convierta 2,7 g/cm³ (aluminio) a kg/m³.",
 ans:2700,unit:"kg/m³",sol:["g/cm³ → kg/m³: multiplicar por 1000","2,7 × 1000 = 2700 kg/m³"],
 errs:[[0.0027,"Dividiste entre 1000; al pasar a kg/m³ se multiplica."],[270,"El factor es 1000, no 100."]],hint:"× 1000"},
{id:"d09",ind:2,lvl:2,type:"num",tags:["unid"],
 q:"La densidad del aceite es 800 kg/m³. Exprésela en g/cm³.",
 ans:0.8,unit:"g/cm³",sol:["kg/m³ → g/cm³: dividir entre 1000","800 ÷ 1000 = 0,8 g/cm³"],
 errs:[[800000,"Multiplicaste; de kg/m³ a g/cm³ se divide entre 1000."],[8,"El factor es 1000, no 100."]],hint:"÷ 1000"},
{id:"d10",ind:2,lvl:2,type:"num",tags:["desm","unid"],
 q:"¿Qué masa en gramos tienen 2,0 L de agua?",data:"ρ(agua) = 1,0 g/cm³",
 ans:2000,unit:"g",sol:["Convertir: 2,0 L = 2000 cm³","m = ρ·V = 1,0 × 2000","m = 2000 g (2 kg)"],
 errs:[[2,"Usaste V = 2 sin convertir los litros: 2 L = 2000 cm³."]],hint:"1 L = 1000 cm³"},
{id:"d11",ind:2,lvl:2,type:"num",tags:["desv"],
 q:"Un trozo de aluminio tiene 540 g de masa. ¿Qué volumen ocupa?",data:"ρ(aluminio) = 2,7 g/cm³",
 ans:200,unit:"cm³",sol:["V = m / ρ","V = 540 ÷ 2,7","V = 200 cm³"],
 errs:[[1458,"Multiplicaste m × ρ. Para el volumen se divide: V = m/ρ."],[0.005,"Invertiste: es m/ρ, no ρ/m."]],hint:"V = m / ρ"},
{id:"d12",ind:2,lvl:2,type:"num",tags:["desm"],
 q:"Calcule la masa de 0,003 m³ de hierro.",data:"ρ(hierro) = 7860 kg/m³",
 ans:23.58,unit:"kg",sol:["m = ρ·V","m = 7860 × 0,003","m = 23,58 kg"],
 errs:[[2620000,"Dividiste ρ entre V; la masa se obtiene multiplicando."]],hint:"m = ρ · V"},
{id:"d13",ind:2,lvl:2,type:"num",tags:["unid","ctx"],
 q:"Un tanque de agua de una casa tiene un volumen de 0,5 m³. ¿Cuántos litros son?",
 ans:500,unit:"L",sol:["1 m³ = 1000 L","0,5 × 1000 = 500 L"],
 errs:[[0.0005,"Dividiste; de m³ a L se multiplica por 1000."],[50,"El factor es 1000."]],hint:"1 m³ = 1000 L"},
{id:"d14",ind:2,lvl:3,type:"num",tags:["form","mat"],
 q:"Un bloque rectangular mide 2 cm × 3 cm × 5 cm y tiene una masa de 81 g. Calcule su densidad.",
 ans:2.7,unit:"g/cm³",sol:["Volumen: V = 2 × 3 × 5 = 30 cm³","ρ = m/V = 81 ÷ 30","ρ = 2,7 g/cm³ → coincide con el aluminio"],
 errs:[[8.1,"Usaste 10 cm³ como volumen (sumaste las medidas). V = largo × ancho × alto = 30 cm³."],[0.37,"Invertiste la fórmula."]],hint:"Primero calcula V = largo × ancho × alto."},
{id:"d15",ind:2,lvl:3,type:"mc",tags:["mat","unid","ctx"],
 q:"Una corona de 1,93 kg ocupa 100 cm³. Según la tabla, ¿de qué material está hecha? <span class='data'>Oro 19,3 g/cm³ · Plomo 11,3 g/cm³ · Plata 10,5 g/cm³ · Cobre 8,96 g/cm³</span>",
 opts:[["Oro.","¡Correcto! 1,93 kg = 1930 g; ρ = 1930 ÷ 100 = 19,3 g/cm³."],["Plata.","Recalcula: primero pasa 1,93 kg a gramos (1930 g)."],["Cobre.","Revisa la conversión de kg a g."],["Ninguno: la densidad da 0,0193 g/cm³.","Ese resultado sale de no convertir kg a g. 1,93 kg = 1930 g."]],
 ex:"Antes de dividir, la masa y el volumen deben estar en unidades compatibles (g y cm³)."},
{id:"d16",ind:2,lvl:3,type:"num",tags:["desv","ctx","form"],
 q:"En una probeta hay 50 mL de agua. Al introducir una piedra de 52 g, el nivel sube a 70 mL. Calcule la densidad de la piedra.",
 ans:2.6,unit:"g/cm³",sol:["Volumen de la piedra (desplazamiento): 70 − 50 = 20 mL = 20 cm³","ρ = m/V = 52 ÷ 20","ρ = 2,6 g/cm³"],
 errs:[[1.04,"Usaste 50 mL. El volumen de la piedra es la DIFERENCIA de niveles."],[0.743,"Usaste 70 mL. El volumen es 70 − 50 = 20 mL."]],hint:"El volumen de la piedra es lo que sube el agua."},
{id:"d17",ind:2,lvl:3,type:"mc",tags:["prop"],
 q:"Dos objetos tienen la MISMA masa, pero el objeto A tiene el doble de volumen que el B. Entonces…",
 opts:[["La densidad de A es la mitad de la de B.","¡Correcto! Con m constante, ρ es inversamente proporcional a V."],["La densidad de A es el doble de la de B.","Más volumen con la misma masa → menos densidad."],["Tienen la misma densidad.","Si los volúmenes son distintos y la masa es igual, las densidades difieren."],["No se puede saber sin números.","La relación de proporcionalidad basta para concluir."]],
 ex:"ρ = m/V: con m fija, si V se duplica, ρ se reduce a la mitad."},
{id:"d18",ind:2,lvl:3,type:"mc",tags:["prop","desm"],
 q:"Dos cubos tienen el MISMO volumen; la densidad de A es el triple de la de B. ¿Qué relación hay entre sus masas?",
 opts:[["m(A) = 3 · m(B)","¡Correcto! Con V constante, m = ρV es directamente proporcional a ρ."],["m(A) = m(B) / 3","Con más densidad e igual volumen hay MÁS masa."],["m(A) = m(B)","Las masas solo serían iguales si las densidades fueran iguales."],["m(A) = 9 · m(B)","La relación es lineal, no cuadrática."]],
 ex:"m = ρV. Si V es igual, la masa crece en la misma proporción que la densidad."},
{id:"d19",ind:2,lvl:3,type:"mc",tags:["prop","rep"],fig:"graficaMV",
 q:"La gráfica muestra masa contra volumen para dos sustancias A y B. ¿Qué representa la pendiente y cuál es más densa?",
 opts:[["La pendiente es la densidad; A es más densa.","¡Correcto! Pendiente = Δm/ΔV = ρ. La recta más inclinada (A) tiene mayor densidad."],["La pendiente es la densidad; B es más densa.","B tiene menor pendiente: para el mismo volumen tiene menos masa."],["La pendiente es el volumen; A ocupa más espacio.","La pendiente de m contra V es m/V, es decir, la densidad."],["La pendiente es la presión.","La presión no se obtiene de una gráfica de masa contra volumen."]],
 ex:"En una gráfica m–V, una recta por el origen indica proporcionalidad y su pendiente es ρ."},
{id:"d20",ind:2,lvl:3,type:"mc",tags:["prop"],
 q:"Una jeringa sellada contiene aire. Si se comprime hasta la mitad de su volumen (sin que escape aire), su densidad…",
 opts:[["Se duplica.","¡Correcto! La masa es la misma y el volumen es la mitad: ρ = m/(V/2) = 2ρ."],["Se reduce a la mitad.","Menos volumen con la misma masa da más densidad."],["No cambia, porque la masa es la misma.","La masa no cambia, pero el volumen sí."],["Se vuelve cero.","El aire sigue teniendo masa."]],
 ex:"A diferencia de los líquidos, los gases son compresibles: su densidad cambia con el volumen."},
{id:"d21",ind:2,lvl:3,type:"mc",tags:["form"],
 q:"Un estudiante calcula la densidad de un objeto de 100 g y 40 cm³ así: ρ = 40/100 = 0,4 g/cm³. ¿Cuál es su error y cuál el resultado correcto?",
 opts:[["Invirtió la fórmula; lo correcto es 100/40 = 2,5 g/cm³.","¡Bien analizado! ρ = m/V."],["No hay error; 0,4 g/cm³ es correcto.","Revisa la fórmula: la masa va arriba."],["Debió multiplicar: 4000 g/cm³.","La densidad es un cociente."],["Debió sumar: 140 g/cm³.","No se suman masa y volumen."]],
 ex:"Verificar unidades ayuda: g ÷ cm³ = g/cm³. Si divides cm³ ÷ g, obtienes cm³/g, que no es una densidad."},
{id:"d22",ind:2,lvl:2,type:"num",tags:["desm","ctx"],
 q:"Un lingote de oro tiene un volumen de 50 cm³. Calcule su masa en gramos.",data:"ρ(oro) = 19,3 g/cm³",
 ans:965,unit:"g",sol:["m = ρ·V","m = 19,3 × 50","m = 965 g"],errs:[[2.59,"Dividiste V entre ρ; la masa se obtiene multiplicando."]],hint:"m = ρ · V"},
{id:"d23",ind:2,lvl:3,type:"num",tags:["desv","unid","ctx"],
 q:"¿Cuántos litros ocupan 4,6 kg de aceite cuya densidad es 920 kg/m³?",
 ans:5,unit:"L",sol:["V = m/ρ = 4,6 ÷ 920 = 0,005 m³","0,005 m³ × 1000 = 5 L"],
 errs:[[0.005,"Ese volumen está en m³. Conviértelo a litros (× 1000)."],[4232,"Multiplicaste m × ρ; el volumen se obtiene dividiendo."]],hint:"Calcula V en m³ y luego pásalo a litros."},
{id:"d24",ind:2,lvl:2,type:"mc",tags:["mat","dens"],
 q:"Un material desconocido tiene m = 79 g y V = 10 cm³. ¿Cuál es? <span class='data'>Hierro 7,9 g/cm³ · Aluminio 2,7 g/cm³ · Vidrio 2,5 g/cm³ · Corcho 0,24 g/cm³</span>",
 opts:[["Hierro.","¡Correcto! 79 ÷ 10 = 7,9 g/cm³."],["Aluminio.","El aluminio tiene 2,7 g/cm³; aquí da 7,9 g/cm³."],["Vidrio.","El vidrio tiene unos 2,5 g/cm³."],["Corcho.","El corcho es muy poco denso (0,24 g/cm³)."]],
 ex:"Como la densidad es una propiedad característica, sirve para identificar sustancias."},

/* ---------------- INDICADOR 3 · IDENTIFICA ---------------- */
{id:"e01",ind:3,lvl:1,type:"mc",tags:["carga"],
 q:"¿Cuál es la unidad de la carga eléctrica en el Sistema Internacional?",
 opts:[["El coulomb (C).","¡Correcto! El símbolo de la carga es Q y su unidad es el coulomb."],["El amperio (A).","El amperio mide la intensidad de corriente."],["El voltio (V).","El voltio mide la diferencia de potencial (voltaje)."],["El ohmio (Ω).","El ohmio mide la resistencia eléctrica."]],
 ex:"Carga: Q → coulomb (C). Intensidad: I → amperio (A). Tiempo: t → segundo (s)."},
{id:"e02",ind:3,lvl:1,type:"mc",tags:["inten"],
 q:"La intensidad de corriente eléctrica se mide en…",
 opts:[["Amperios (A).","¡Correcto!"],["Coulombs (C).","El coulomb mide la carga."],["Vatios (W).","El vatio mide la potencia."],["Segundos (s).","El segundo mide el tiempo."]],
 ex:"La unidad de intensidad es el amperio, en honor a André-Marie Ampère."},
{id:"e03",ind:3,lvl:1,type:"mc",tags:["inten","carga","tiempo"],
 q:"Un amperio (1 A) equivale a…",
 opts:[["1 coulomb por segundo (1 C/s).","¡Exacto! I = Q/t → A = C/s."],["1 coulomb por 1 segundo multiplicado (1 C·s).","La corriente es un cociente: carga ÷ tiempo."],["1 segundo por coulomb (1 s/C).","Está invertido."],["1 julio por coulomb (1 J/C).","1 J/C es un voltio."]],
 ex:"1 A significa que por una sección del conductor pasa 1 C de carga cada segundo."},
{id:"e04",ind:3,lvl:1,type:"mc",tags:["inten"],
 q:"La intensidad de corriente eléctrica se define como…",
 opts:[["La cantidad de carga que atraviesa una sección del conductor por unidad de tiempo.","¡Correcto! I = Q/t."],["La energía que consume un aparato.","Eso se relaciona con la potencia y la energía."],["La oposición de un material al paso de la corriente.","Esa es la resistencia eléctrica."],["La «fuerza» que empuja a las cargas.","Eso es la diferencia de potencial (voltaje)."]],
 ex:"I = Q / t: más carga en el mismo tiempo → mayor intensidad."},
{id:"e05",ind:3,lvl:1,type:"mc",tags:["elec"],
 q:"¿Cuál es la carga de un electrón?",
 opts:[["−1,6 × 10⁻¹⁹ C","¡Correcto! Es la carga elemental, con signo negativo."],["+1,6 × 10⁻¹⁹ C","Esa es la carga del protón."],["−9,11 × 10⁻³¹ C","9,11 × 10⁻³¹ es la MASA del electrón (en kg), no su carga."],["−1 C","Un coulomb equivale a unos 6,25 × 10¹⁸ electrones."]],
 ex:"e = 1,6 × 10⁻¹⁹ C. Por eso, 1 C ≈ 6,25 × 10¹⁸ electrones."},
{id:"e06",ind:3,lvl:1,type:"mc",tags:["tiempo"],
 q:"En la fórmula I = Q/t, ¿en qué unidad debe expresarse el tiempo para obtener amperios?",
 opts:[["En segundos (s).","¡Correcto! Es la unidad SI de tiempo."],["En minutos.","Primero convierte: 1 min = 60 s."],["En horas.","Primero convierte: 1 h = 3600 s."],["En cualquier unidad, da igual.","Si no usas segundos, el resultado no queda en amperios."]],
 ex:"Siempre convierte el tiempo a segundos: min × 60, h × 3600, ms ÷ 1000."},
{id:"e07",ind:3,lvl:1,type:"mc",tags:["sent"],
 q:"Por acuerdo histórico, el SENTIDO CONVENCIONAL de la corriente en un circuito va…",
 opts:[["Del polo positivo (+) al negativo (−), por el circuito externo.","¡Correcto! Así se dibuja en los diagramas de circuitos."],["Del polo negativo (−) al positivo (+), por el circuito externo.","Ese es el sentido REAL (electrónico) del movimiento de los electrones."],["En ambas direcciones a la vez.","En corriente continua la corriente tiene un único sentido."],["No tiene un sentido definido.","Sí lo tiene: por convención va de + a −."]],
 ex:"Convencional: + → −. Real (electrones): − → +. Son opuestos."},
{id:"e08",ind:3,lvl:2,type:"mc",tags:["sent","rep"],fig:"cable",
 q:"En el cable de la figura, los electrones se mueven de izquierda a derecha. ¿Cuál es el sentido CONVENCIONAL de la corriente?",
 opts:[["De derecha a izquierda.","¡Correcto! El sentido convencional es opuesto al movimiento de los electrones."],["De izquierda a derecha.","Ese es el sentido de los electrones (sentido real), no el convencional."],["Hacia arriba.","La corriente sigue la dirección del conductor."],["No hay corriente porque los electrones son negativos.","Sí hay corriente: hay carga en movimiento."]],
 ex:"La corriente convencional se definió como el movimiento de cargas positivas, opuesto al de los electrones."},
{id:"e09",ind:3,lvl:1,type:"mc",tags:["tipos"],
 q:"La corriente continua (CC o DC) se caracteriza porque…",
 opts:[["Fluye siempre en el mismo sentido; la producen pilas y baterías.","¡Correcto!"],["Cambia de sentido periódicamente.","Esa es la corriente alterna (CA)."],["Solo existe en los rayos.","La CC está en todos los aparatos de baterías."],["Nunca se usa en aparatos electrónicos.","Los celulares, las laptops y los controles funcionan con CC."]],
 ex:"CC: sentido constante (pilas, baterías, paneles solares). CA: cambia de sentido periódicamente (tomacorrientes)."},
{id:"e10",ind:3,lvl:2,type:"mc",tags:["tipos","ctx"],
 q:"La corriente que llega a los tomacorrientes de una casa en Costa Rica es…",
 opts:[["Alterna (CA), con una frecuencia de 60 Hz.","¡Correcto! En Costa Rica: 120 V y 60 Hz, es decir, cambia de sentido 120 veces por segundo."],["Continua (CC), igual que la de una batería.","La red eléctrica distribuye corriente alterna."],["Continua, porque viene de plantas hidroeléctricas.","Los generadores de las plantas producen corriente alterna."],["No tiene tipo definido.","Es corriente alterna."]],
 ex:"La CA se usa en la red porque es fácil transformar su voltaje para transportarla a grandes distancias. Los cargadores la convierten en CC."},
{id:"e11",ind:3,lvl:2,type:"mc",tags:["tipos","rep"],fig:"ccca",
 q:"Las gráficas muestran cómo varía la intensidad (I) con el tiempo (t). ¿Cuál afirmación es correcta?",
 opts:[["La gráfica 1 es corriente continua y la 2 es corriente alterna.","¡Correcto! La 1 se mantiene constante; la 2 oscila y cambia de signo (de sentido)."],["La gráfica 1 es alterna y la 2 es continua.","La alterna es la que oscila (gráfica 2)."],["Ambas son corriente continua.","La gráfica 2 cambia de signo: eso es corriente alterna."],["Ambas son corriente alterna.","La gráfica 1 no cambia: es corriente continua."]],
 ex:"Cuando la gráfica I–t cruza el eje del tiempo, la corriente cambia de sentido: es alterna."},
{id:"e12",ind:3,lvl:1,type:"mc",tags:["cond"],
 q:"¿Cuál grupo está formado SOLO por buenos conductores eléctricos?",
 opts:[["Cobre, plata y aluminio.","¡Correcto! Los metales tienen electrones libres."],["Plástico, vidrio y caucho.","Son aislantes: no permiten el paso de la corriente."],["Silicio y germanio.","Son semiconductores: conducen solo en ciertas condiciones."],["Madera seca, cerámica y aire.","Son aislantes."]],
 ex:"Conductores: metales (Ag, Cu, Au, Al) y agua con sales. Aislantes: plástico, vidrio, caucho, madera seca. Semiconductores: Si, Ge."},
{id:"e13",ind:3,lvl:2,type:"mc",tags:["cond","ctx"],
 q:"¿Por qué los cables eléctricos de una casa son de cobre y están recubiertos de plástico?",
 opts:[["El cobre conduce la corriente y el plástico, por ser aislante, evita descargas y cortocircuitos.","¡Correcto! Cada material cumple una función según su comportamiento eléctrico."],["El plástico conduce la corriente y el cobre la protege.","Es al revés: el cobre conduce y el plástico aísla."],["Ambos materiales son conductores.","El plástico es aislante."],["El plástico aumenta la intensidad de la corriente.","El recubrimiento no cambia la intensidad; solo aísla."]],
 ex:"Conductor por dentro, aislante por fuera: así se aprovecha el comportamiento de cada material."},
{id:"e14",ind:3,lvl:2,type:"mc",tags:["cond"],
 q:"Los semiconductores, como el silicio, se caracterizan porque…",
 opts:[["Su conductividad es intermedia y puede controlarse; se usan en chips, diodos y transistores.","¡Correcto! Son la base de la electrónica moderna."],["Conducen mejor que la plata.","La plata es el mejor conductor."],["Nunca permiten el paso de la corriente.","Esa descripción corresponde a un aislante ideal."],["Son metales líquidos.","El silicio es un sólido no metálico (metaloide)."]],
 ex:"Semiconductor: conduce más que un aislante y menos que un conductor; su conductividad depende de la temperatura, la luz o las impurezas."},
{id:"e15",ind:3,lvl:1,type:"mc",tags:["cond","elec"],
 q:"En un conductor metálico, la corriente eléctrica se produce por el movimiento de…",
 opts:[["Electrones libres.","¡Correcto! En los metales, los electrones de valencia se mueven con facilidad."],["Protones.","Los protones están fijos en el núcleo."],["Neutrones.","Los neutrones no tienen carga."],["Átomos completos.","Los átomos del metal permanecen en la red cristalina."]],
 ex:"En los metales se mueven electrones; en las soluciones (electrolitos) se mueven iones positivos y negativos."},
{id:"e16",ind:3,lvl:1,type:"mc",tags:["med"],
 q:"¿Qué instrumento mide la intensidad de corriente y cómo se conecta?",
 opts:[["El amperímetro, conectado en serie.","¡Correcto! Toda la corriente debe pasar a través de él."],["El voltímetro, conectado en paralelo.","El voltímetro mide voltaje, no intensidad."],["El amperímetro, conectado en paralelo.","Así se puede dañar el instrumento; el amperímetro va en serie."],["La balanza.","La balanza mide masa."]],
 ex:"Amperímetro → serie (mide I). Voltímetro → paralelo (mide V)."},
{id:"e17",ind:3,lvl:2,type:"num",tags:["pref","inten"],
 q:"Convierta 250 mA a amperios.",ans:0.25,unit:"A",
 sol:["1 mA = 0,001 A (mili = 10⁻³)","250 × 0,001 = 0,25 A"],errs:[[250000,"Multiplicaste por 1000; de mA a A se divide entre 1000."],[2.5,"El factor es 1000, no 100."]],hint:"÷ 1000"},
{id:"e18",ind:3,lvl:2,type:"num",tags:["tiempo"],
 q:"Convierta 5 minutos a segundos.",ans:300,unit:"s",sol:["1 min = 60 s","5 × 60 = 300 s"],errs:[[0.083,"Dividiste; de minutos a segundos se multiplica por 60."]],hint:"× 60"},
{id:"e19",ind:3,lvl:2,type:"num",tags:["pref","carga"],
 q:"Convierta 45 µC (microcoulombs) a coulombs.",ans:4.5e-5,unit:"C",
 sol:["micro (µ) = 10⁻⁶","45 × 10⁻⁶ C = 4,5 × 10⁻⁵ C = 0,000045 C"],errs:[[0.045,"Usaste el factor de mili (10⁻³); micro es 10⁻⁶."]],hint:"µ = 10⁻⁶"},
{id:"e20",ind:3,lvl:2,type:"num",tags:["tiempo"],
 q:"Convierta 1,5 horas a segundos.",ans:5400,unit:"s",sol:["1 h = 3600 s","1,5 × 3600 = 5400 s"],errs:[[90,"Ese resultado está en minutos; multiplica otra vez por 60."]],hint:"× 3600"},
{id:"e21",ind:3,lvl:2,type:"mc",tags:["carga"],
 q:"Un cuerpo eléctricamente neutro PIERDE electrones al frotarlo. ¿Cómo queda cargado?",
 opts:[["Positivamente.","¡Correcto! Ahora tiene más protones que electrones."],["Negativamente.","Quedaría negativo si GANARA electrones."],["Sigue neutro.","Al perder carga negativa deja de estar neutro."],["Pierde también sus protones.","Los protones permanecen en el núcleo."]],
 ex:"Ganar electrones → carga negativa. Perder electrones → carga positiva."},
{id:"e22",ind:3,lvl:2,type:"mc",tags:["carga"],
 q:"Se acercan dos esferas cargadas negativamente. ¿Qué ocurre?",
 opts:[["Se repelen.","¡Correcto! Las cargas del mismo signo se repelen."],["Se atraen.","Se atraen las cargas de signos opuestos."],["No interactúan.","Toda carga interactúa con las demás cargas."],["Se neutralizan.","Dos cargas negativas no se neutralizan entre sí."]],
 ex:"Ley de las cargas: los signos iguales se repelen y los opuestos se atraen."},
{id:"e23",ind:3,lvl:3,type:"tf",tags:["sent"],
 q:"En un conductor metálico, la corriente convencional tiene el mismo sentido que el movimiento de los electrones.",
 a:false, ex:"Falso. La corriente convencional (+ → −) va en sentido contrario al de los electrones (− → +)."},
{id:"e24",ind:3,lvl:3,type:"mc",tags:["inten","carga","tiempo"],
 q:"En la expresión I = Q/t, ¿qué representa cada letra y cuál es su unidad?",
 opts:[["I: intensidad (A); Q: carga (C); t: tiempo (s).","¡Correcto!"],["I: impulso (N·s); Q: calor (J); t: temperatura (K).","Son magnitudes de otros temas."],["I: intensidad (C); Q: carga (A); t: tiempo (min).","Las unidades están intercambiadas y el tiempo no está en la unidad SI."],["I: inercia (kg); Q: cantidad (mol); t: tiempo (h).","No corresponde a la electricidad."]],
 ex:"Magnitud → símbolo → unidad: intensidad (I, A), carga (Q, C) y tiempo (t, s)."},
{id:"e25",ind:3,lvl:3,type:"mc",tags:["elec","carga"],
 q:"La carga está cuantizada (es un múltiplo de e = 1,6 × 10⁻¹⁹ C). ¿Cuál de estos valores NO puede ser la carga de un cuerpo?",
 opts:[["0,8 × 10⁻¹⁹ C","¡Correcto! Es la mitad de la carga elemental, y no existe medio electrón libre."],["3,2 × 10⁻¹⁹ C","Es posible: corresponde a 2 electrones (2e)."],["4,8 × 10⁻¹⁹ C","Es posible: corresponde a 3e."],["1,6 × 10⁻¹⁸ C","Es posible: corresponde a 10e."]],
 ex:"Q = n·e, donde n es un número entero de electrones."},
{id:"e26",ind:3,lvl:2,type:"mc",tags:["pref"],
 q:"¿Cuál equivalencia es correcta?",
 opts:[["1 mA = 1 × 10⁻³ A","¡Correcto! mili = milésima."],["1 µA = 1 × 10⁻³ A","micro es 10⁻⁶."],["1 kA = 100 A","kilo = 1000."],["1 mC = 1000 C","mili es una milésima, no mil."]],
 ex:"k = 10³ · m = 10⁻³ · µ = 10⁻⁶."},
{id:"e27",ind:3,lvl:3,type:"mc",tags:["cond","ctx"],
 q:"¿Por qué es peligroso usar aparatos eléctricos con las manos mojadas?",
 opts:[["Porque el agua con sales (como el sudor o el agua del tubo) conduce la corriente y facilita que pase por el cuerpo.","¡Correcto! El agua con iones disueltos es conductora."],["Porque el agua es un aislante perfecto.","El agua pura conduce poco, pero la del tubo o el sudor tienen sales que la vuelven conductora."],["Porque el agua aumenta el voltaje del tomacorriente.","El voltaje de la red no cambia."],["No es peligroso.","Sí lo es: aumenta el riesgo de una descarga eléctrica."]],
 ex:"En los líquidos con sales disueltas, la corriente se debe al movimiento de iones."},

/* ---------------- INDICADOR 4 · RESUELVE ---------------- */
{id:"i01",ind:4,lvl:1,type:"mc",tags:["cq"],
 q:"Si conoces la intensidad (I) y el tiempo (t), ¿cómo calculas la carga?",
 opts:[["Q = I · t","¡Correcto! Se despeja de I = Q/t."],["Q = I / t","Al despejar, t pasa a multiplicar."],["Q = t / I","Esa expresión no corresponde."],["Q = I + t","No es una suma."]],
 ex:"Triángulo: Q arriba, I y t abajo → Q = I·t · I = Q/t · t = Q/I."},
{id:"i02",ind:4,lvl:1,type:"mc",tags:["ct"],
 q:"¿Cuál es el despeje correcto para el tiempo?",
 opts:[["t = Q / I","¡Correcto!"],["t = I / Q","Está invertido."],["t = Q · I","Las unidades darían C·A, no segundos."],["t = I − Q","No es una resta."]],
 ex:"De I = Q/t → t·I = Q → t = Q/I."},
{id:"i03",ind:4,lvl:2,type:"num",tags:["ci"],
 q:"Por un conductor pasan 30 C de carga en 10 s. Calcule la intensidad de corriente.",
 ans:3,unit:"A",sol:["I = Q / t","I = 30 C ÷ 10 s","I = 3 A"],errs:[[300,"Multiplicaste Q × t; se divide."],[0.333,"Invertiste: es Q/t."]],hint:"I = Q / t"},
{id:"i04",ind:4,lvl:2,type:"num",tags:["cq","conv"],
 q:"Una corriente de 2 A circula durante 5 minutos. ¿Cuánta carga pasó?",
 ans:600,unit:"C",sol:["Convertir: t = 5 min × 60 = 300 s","Q = I·t = 2 × 300","Q = 600 C"],
 errs:[[10,"Usaste 5 min sin convertir a segundos (5 min = 300 s)."]],hint:"Pasa el tiempo a segundos."},
{id:"i05",ind:4,lvl:2,type:"num",tags:["ct"],
 q:"¿Cuánto tiempo tarda en pasar una carga de 45 C con una corriente de 0,5 A?",
 ans:90,unit:"s",sol:["t = Q / I","t = 45 ÷ 0,5","t = 90 s"],errs:[[22.5,"Multiplicaste Q × I; el tiempo es Q ÷ I."]],hint:"t = Q / I"},
{id:"i06",ind:4,lvl:3,type:"num",tags:["cq","conv"],
 q:"Una corriente de 250 mA circula durante 2 minutos. Calcule la carga transportada.",
 ans:30,unit:"C",sol:["I = 250 mA = 0,25 A","t = 2 min = 120 s","Q = I·t = 0,25 × 120 = 30 C"],
 errs:[[0.5,"Te faltó convertir los minutos a segundos."],[30000,"Te faltó convertir los mA a A."],[500,"No convertiste ninguna unidad."]],hint:"Convierte mA → A y min → s."},
{id:"i07",ind:4,lvl:3,type:"num",tags:["ne","ci"],
 q:"Por un cable pasan 3,0 × 10²⁰ electrones en 4 s. Calcule la intensidad de corriente.",data:"e = 1,6 × 10⁻¹⁹ C",
 ans:12,unit:"A",sol:["Carga: Q = n·e = 3,0 × 10²⁰ × 1,6 × 10⁻¹⁹ = 48 C","I = Q/t = 48 ÷ 4","I = 12 A"],
 errs:[[48,"Esa es la carga Q. Falta dividirla entre el tiempo."],[7.5e19,"Dividiste el número de electrones entre t sin convertirlo a coulombs."]],hint:"Primero pasa los electrones a coulombs: Q = n·e."},

const SUP={"-":"⁻","0":"⁰","1":"¹","2":"²","3":"³","4":"⁴","5":"⁵","6":"⁶","7":"⁷","8":"⁸","9":"⁹"};
function grp(s){ // separador de miles con espacio fino para enteros >= 10 000
  const [i,d]=s.split("."); const neg=i.startsWith("-"); let a=neg?i.slice(1):i;
  if(a.length>4) a=a.replace(/\B(?=(\d{3})+(?!\d))/g," ");
  return (neg?"-":"")+a+(d?","+d:"");
}
function fmt(n){
  if(!isFinite(n)) return "—";
  const a=Math.abs(n);
  if(a!==0 && (a>=1e7 || a<1e-3)){
    const [m,e]=n.toExponential(2).split("e");
    return (+m).toString().replace(".",",")+" × 10"+String(+e).split("").map(c=>SUP[c]||c).join("");
  }
  return grp(String(+n.toPrecision(6)));
}
function parseNum(raw){
  if(raw==null) return NaN;
  let s=String(raw).trim().toLowerCase().replace(/[\s  ]/g,"").replace(/[−–]/g,"-");
  s=s.replace(/[⁰¹²³⁴⁵⁶⁷⁸⁹⁻]+/g,m=>"^"+m.split("").map(c=>{const k=Object.keys(SUP).find(k=>SUP[k]===c);return k;}).join(""));
  s=s.replace(/[x×*·]10\^?\(?([+-]?\d+)\)?/,"e$1").replace(/^10\^\(?([+-]?\d+)\)?/,"1e$1");
  const dots=(s.match(/\./g)||[]).length;
  if(s.includes(",")&&s.includes(".")){ s = s.lastIndexOf(",")>s.lastIndexOf(".") ? s.replace(/\./g,"").replace(",",".") : s.replace(/,/g,""); }
  else if(s.includes(",")) s=s.replace(",",".");
  else if(dots>1) s=s.replace(/\./g,"");
  const m=s.match(/^[+-]?(\d+\.?\d*|\.\d+)(e[+-]?\d+)?/);
  return m?parseFloat(m[0]):NaN;
}
const close=(x,y,tol=0.02)=>y===0?Math.abs(x)<1e-9:Math.abs(x-y)<=Math.abs(y)*tol;
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a;};

let route="home", learnInd=1, session=null, simTimer=null;
function go(r,opts={}){
  route=r; if(simTimer){cancelAnimationFrame(simTimer);simTimer=null;}
  const tabFor = r==="quiz" ? (session&&EXL(session.mode)?session.mode:session&&session.mode==="cero"?"learn":"practice")
    : (r==="cero"||r==="station"||r==="pide"||r==="calc")?"learn" : r==="result"?(session&&EXL(session.mode)?session.mode:session&&session.mode==="cero"?"learn":"practice") : r;
  document.querySelectorAll(".tab").forEach(b=>b.setAttribute("aria-current",b.dataset.go===tabFor?"page":"false"));
  const m=$("#main"); m.innerHTML=""; const v=document.createElement("div"); v.className="view"; m.appendChild(v);
  ({home:vHome,diag:vDiag,pide:vPide,calc:vCalc,cero:vCero,station:vStation,learn:vLearn,practice:vPractice,exam:vExam,progress:vProgress,quiz:vQuiz,result:vResult})[r](v,opts);
  if(!opts.keepScroll) window.scrollTo({top:0});
  if(opts.focus!==false) m.focus({preventScroll:true});
}

      const sgn=ty==="ca"?(dir>=0?1:-1):1;
      let dots=""; for(let k=0;k<N;k++){let x=((k*30+ph)%300+300)%300; dots+=`<circle cx="${x}" cy="${68+(k%3-1)*8}" r="6" class="inkd"/>`;}
      w.innerHTML=`<rect x="0" y="45" width="300" height="46" rx="23" class="fc3" opacity=".25"/>${dots}
        <text x="8" y="30" class="svgt">e⁻ (real): ${sgn>0?"→":"←"}</text>
        <path d="M${sgn>0?230:70} 120 L${sgn>0?70:230} 120" stroke="var(--c3)" stroke-width="3"/><path d="M${sgn>0?80:220} 112 L${sgn>0?70:230} 120 L${sgn>0?80:220} 128" stroke="var(--c3)" stroke-width="3" fill="none"/>
        <text x="96" y="145" class="svgtb">I convencional ${sgn>0?"←":"→"}</text>`;
      simTimer=requestAnimationFrame(draw);};
    ["#w-q","#w-t","#w-type"].forEach(s=>$(s).oninput=out); out(); simTimer=requestAnimationFrame(draw);
  }
}

function startExam(){
  // 6 por indicador: 2 de conocimiento, 2 de aplicación, 2 de análisis (con respaldo si faltan)
  let items=[];
  IND.forEach(I=>{
    const pool=l=>shuffle(BANK.filter(q=>q.ind===I.id&&q.lvl===l));
    const sel=[...pool(1).slice(0,2),...pool(2).slice(0,2),...pool(3).slice(0,2)];
    if(sel.length<6){const rest=shuffle(BANK.filter(q=>q.ind===I.id&&!sel.includes(q)));sel.push(...rest.slice(0,6-sel.length));}
    items.push(...sel);
  });
  items=[1,2,3].flatMap(l=>items.filter(q=>q.lvl===l));
  session={mode:"exam",items:items.map(prepItem),i:0,ans:{},start:Date.now(),title:"📝 Simulacro"};
  go("quiz");
}

function refreshPalette(){document.querySelectorAll(".palette button").forEach((b,k)=>{const a=session.ans[k];b.classList.toggle("done",!!(a&&a.v!==undefined&&a.v!==""));});}
function navButtons(q,a,answered){

function grade(q,a){
  if(!a||a.v===undefined||a.v==="") return false;
  if(q.type==="mc") return a.v===0;
  if(q.type==="tf") return a.v===q.a;
  return close(parseNum(a.raw),q.ans,q.tol||0.02);
}
function feedback(q,a){
  const ok=grade(q,a); let spec="", extra="";
  if(a.skip){
    spec="Marcaste «Aún no lo sé». ¡Está bien! Esto es justo lo que vas a aprender.";
    extra=`<p>✅ <b>Respuesta correcta:</b> ${q.type==="mc"?q.opts[0][0]:q.type==="tf"?(q.a?"Verdadero":"Falso"):fmt(q.ans)+" "+q.unit}</p>`;
  } else if(q.type==="mc"){
    spec = q.opts[a.v][1];
    if(!ok) extra=`<p>✅ <b>Respuesta correcta:</b> ${q.opts[0][0]}</p>`;
  } else if(q.type==="tf"){
    spec = ok?"¡Bien razonado!":"Revisa la afirmación con cuidado.";
  } else {
    const x=parseNum(a.raw);
    if(isNaN(x)) spec="No se reconoció un número en tu respuesta.";
    else if(ok) spec=`¡Correcto! ${fmt(q.ans)} ${q.unit}.`;
    else { const e=(q.errs||[]).find(([val])=>close(x,val,0.03)); spec=e?`🔎 <b>Error detectado:</b> ${e[1]}`:`Tu resultado (${fmt(x)}) no coincide. Revisa las unidades y el despeje.`;
      extra=`<p>✅ <b>Resultado correcto:</b> ${fmt(q.ans)} ${q.unit}</p>`; }
  }
  const sol=q.sol?`<div class="sol"><b>Solución paso a paso</b><ol class="steps">${q.sol.map(t=>`<li>${t}</li>`).join("")}</ol></div>`:"";
  const ex=q.ex?`<p>📖 ${q.ex}</p>`:"";
  const t2=a.retry&&ok?" ¡Lo lograste en el segundo intento! 🎉":"";
  const enc=!ok&&!EXL(session&&session.mode)?`<p style="color:var(--text-dim)">${pick(ENC)}</p>`:"";
  return `<div class="fb ${ok?"ok":"bad"}" role="status"><div class="ttl">${ok?"✔ ¡Correcto!"+t2:"✘ Aún no"}</div><p>${spec}</p>${extra}${ex}${sol}${enc}</div>`;
}
function check(){
  const s=session,q=s.items[s.i];let a=s.ans[s.i];
  if(q.type==="num"){const raw=($("#num")||{}).value||"";a=s.ans[s.i]=Object.assign(s.ans[s.i]||{},{raw,v:raw});if(!raw.trim()){toast("Escribe tu respuesta");return;}if(isNaN(parseNum(raw))){toast("Escribe un número válido");return;}}
  if(!a||a.v===undefined){toast("Selecciona una opción");return;}
  // Segundo intento (andamiaje): el primer error muestra una pista específica sin revelar la respuesta.
  if(!grade(q,a) && !a.retry && q.type!=="tf" && ["practice","inf","cero"].includes(s.mode)){
    a.retry={v:a.v,msg:specMsg(q,a)}; if(q.type==="mc") delete a.v;
    say("Todavía no. Lee la pista e inténtalo otra vez."); go("quiz",{keepScroll:true,focus:false});
    const rb=document.querySelector(".retry"); if(rb) rb.scrollIntoView({behavior:"smooth",block:"nearest"}); return;
  }
  a.checked=true; const ok=grade(q,a); a.ok=ok;
  if(q.id){ if(ok) S.done[q.id]=1; else if(S.done[q.id]!==1) S.done[q.id]=0; } else S.gen++;
  save(); say(ok?"Correcto":"Incorrecto. Revisa la retroalimentación.");
  go("quiz",{keepScroll:true,focus:false});
  const fbEl=document.querySelector(".fb"); if(fbEl) fbEl.scrollIntoView({behavior:"smooth",block:"nearest"});
  const nb=$("#nextbtn"); if(nb) nb.focus({preventScroll:true});
}
function nextQ(){
  const s=session;
  if(s.mode==="inf"){ s.items.push(prepItem(GEN[s.ind]())); s.i++; go("quiz"); return; }
  if(s.i<s.items.length-1){s.i++;go("quiz");} else if(EXL(s.mode)) submitExam(); else go("result");
}
function submitExam(){
  const s=session; const un=s.items.filter((_,k)=>!s.ans[k]||s.ans[k].v===undefined||s.ans[k].v==="").length;
  if(un && !confirm(`Tienes ${un} ítem(s) sin responder. ¿Entregar de todos modos?`)) return;
  const diag=s.mode==="diag";
  s.items.forEach((q,k)=>{const a=s.ans[k]; if(a){a.checked=true;a.ok=grade(q,a);} if(q.id&&!diag){ if(a&&a.ok) S.done[q.id]=1; else if(S.done[q.id]!==1) S.done[q.id]=0; }});
  s.finished=true; s.end=Date.now();
  const r=scoreSession(s);
  if(diag){ const by={}; Object.entries(r.by).forEach(([k,b])=>by[k]={ok:b.ok,total:b.total}); S.diag.push({d:Date.now(),nota:r.pct,ok:r.ok,total:r.total,by}); }
  else S.exams.push({d:Date.now(),pts:r.pts,pct:r.pct,by:Object.fromEntries(Object.entries(r.by).map(([k,b])=>[k,{ok:b.ok,total:b.total}]))});
  save();
  go("result");
}
function scoreSession(s){
  const by={}; IND.forEach(I=>by[I.id]={ok:0,total:0});
  s.items.forEach((q,k)=>{by[q.ind].total++; const a=s.ans[k]; if(a&&a.checked&&grade(q,a)) by[q.ind].ok++;});
  let pts=0,ok=0,total=0; Object.values(by).forEach(b=>{b.pts=rubricPoints(b.ok,b.total); if(b.total){pts+=b.pts;} ok+=b.ok; total+=b.total;});
  const maxPts=Object.values(by).filter(b=>b.total).length*3;
  return {by,pts,maxPts,ok,total,pct:Math.round(ok/Math.max(1,total)*100)};
}

  v.innerHTML=`<h2>${exam?"📝 Resultado del simulacro":"🎯 Resultado de la práctica"}</h2><p class="lede">${esc(s.title)}${mm!==null?` · ${mm} min`:""}</p>
   <div class="card" style="text-align:center"><div class="score-ring" style="--p:${r.pct};--ring:${ring}" role="img" aria-label="${r.pct} por ciento de aciertos"><div><b>${r.pct}%</b><small>${r.ok}/${r.total} aciertos</small></div></div>

    ${Object.entries(r.by).filter(([k,b])=>b.total).map(([k,b])=>`<tr><td>${indOf(+k).icon} ${k}. ${indOf(+k).verb}<br><small style="color:var(--text-faint);font-weight:600">${RUB_DESC[b.pts]}</small></td><td>${b.ok}/${b.total} (${Math.round(b.ok/b.total*100)}%)</td><td><span class="lvl-pill lvl-${b.pts}">${b.pts===0?"NR":b.pts+" pt"+(b.pts>1?"s":"")}</span></td></tr>`).join("")}</tbody></table></div>

function extractData(raw){
  const t=raw.replace(/[  ]/g," ");
  const alt=U_LIST.map(u=>u[0].replace(/[.*+?^${}()|[\]\\\/]/g,"\\$&")).join("|");
  const re=new RegExp("(\\d+(?:[.,]\\d+)?(?:\\s*[x×]\\s*10\\s*\\^?\\s*[-−⁻]?[\\d⁰¹²³⁴⁵⁶⁷⁸⁹]+)?)\\s*("+alt+")(?![a-záéíóúñµμ²³0-9/])","gi");
  const out=[]; let m;
  while((m=re.exec(t))){
    const u=U_LIST.find(x=>x[0]===m[2].toLowerCase()); if(!u) continue;
    if(["a","c","n","l"].includes(u[0]) && m[2]===m[2].toLowerCase()) continue; // «5 a 10», «de» … solo mayúsculas
    out.push({num:m[1].trim(),k:u[1],u:u[2],name:U_NAME[u[1]]});
  }
  return out;
}
function decode(raw){
  raw=raw.replace(/[  ]/g," ").replace(/(\d)\s(?=\d{3}(?!\d))/g,"$1");
  const full=raw.toLowerCase();
  // La incógnita está en la última pregunta («¿…») o tras el último verbo de instrucción.
  let qi=full.lastIndexOf("¿"); const vre=/(calcul[ae]|determin[ae]|halle|encuentr[ae]|expr[eé]s[ae]|convi[ei]rt[ae])/g; let mm;
  while((mm=vre.exec(full))) qi=Math.max(qi,mm.index);
  const q=qi>=0?full.slice(qi):full;
  const data=extractData(raw); const has=k=>data.some(d=>d.k===k); const hasAny=a=>a.some(has);
  const depthCtx=/profund|fondo|buzo|piscina|sumerg|tanque|represa|líquido|liquido|agua|mar\b|alcohol|aceite|mercurio/.test(full);
  const RULES=[
    [/convi[ei]rt|expr[eé]s/, ()=>hasAny(["mA","uA","uC","mC","min","h","ms"])?"g-pref":"g-conv"],
    [/electrones/, ()=>"g-n"],
    [/presi[oó]n/, ()=>/absoluta|total/.test(q)?"g-abs":(has("N")&&hasAny(["cm2","m2"]))?"g-pfa":(hasAny(["dens","densg"])||depthCtx)?"g-rgh":"g-pfa"],
    [/profundidad|qu[eé] tan profundo/, ()=>"g-h"],
    [/fuerza/, ()=>"g-fpa"],
    [/densidad|material|sustancia/, ()=>(hasAny(["pa","kpa"])&&!hasAny(["g","kg"]))?"g-rhop":/probeta|nivel|sube/.test(full)?"g-prob":/\d\s*cm\s*[x×]\s*\d/.test(full)?"g-prisma":"g-rho"],
    [/masa|cu[aá]nto pesa/, ()=>"g-m"],
    [/volumen|litros|cu[aá]ntos l\b/, ()=>hasAny(["g","kg"])?"g-v":"g-conv"],
    [/tiempo|tarda|dura\b|segundos|minutos|horas/, ()=>/mah/.test(full)?"g-mah":"g-t"],
    [/intensidad|corriente|amperios/, ()=>/gr[aá]fica/.test(full)?"g-graf":has("e")?"g-n":"g-i"],
    [/carga|coulombs?/, ()=>/mah/.test(full)?"g-mah":has("e")?"g-n":"g-q"],
    [/por qu[eé]|explique|en cu[aá]l/, ()=>/corriente|electr|cable|bater/.test(full)?"g-id":"g-why1"]
  ];
  let id=null,best=Infinity;
  RULES.forEach(([re,fn])=>{const m=q.search(re); if(m>=0&&m<best){best=m;id=fn();}});
  // conversiones necesarias
  const conv=[]; const pressure=["g-rgh","g-h","g-abs","g-rhop"].includes(id);
  data.forEach(d=>{
    if(d.k==="cm"&&pressure) conv.push(`${d.num} cm → m (÷ 100)`);
    if(d.k==="cm2") conv.push(`${d.num} cm² → m² (÷ 10 000)`);
    if(d.k==="min") conv.push(`${d.num} min → s (× 60)`);
    if(d.k==="h"&&/^g-(i|q|t|n|mah|pref)$/.test(id||"")) conv.push(`${d.num} h → s (× 3600)`);
    if(d.k==="ms") conv.push(`${d.num} ms → s (÷ 1000)`);
    if(d.k==="mA") conv.push(`${d.num} mA → A (÷ 1000)`);
    if(d.k==="uA") conv.push(`${d.num} µA → A (× 10⁻⁶)`);
    if(d.k==="uC") conv.push(`${d.num} µC → C (× 10⁻⁶)`);
    if(d.k==="mC") conv.push(`${d.num} mC → C (÷ 1000)`);
    if(d.k==="kpa") conv.push(`${d.num} kPa → Pa (× 1000)`);
    if(d.k==="densg"&&pressure) conv.push(`${d.num} g/cm³ → kg/m³ (× 1000)`);
    if(d.k==="L"&&(has("densg")||has("cm3"))) conv.push(`${d.num} L → cm³ (× 1000)`);
    if(d.k==="kg"&&(has("densg")||has("cm3"))) conv.push(`${d.num} kg → g (× 1000)`);
    if(d.k==="g"&&has("dens")) conv.push(`${d.num} g → kg (÷ 1000)`);
  });
  const notes=[];
  if(pressure&&!hasAny(["dens","densg"])&&/agua/.test(full)&&!/mar/.test(full)) notes.push("Es agua y no te dieron la densidad: usa ρ = 1000 kg/m³.");

  if(id==="g-v"&&/litros/.test(q)) notes.push("Te piden litros: convierte el volumen al final.");
  return {id,data,conv,notes};
}

function typeItems(id){
  const T=GTYPE[id];

  const pool=BANK.filter(q=>q.ind===T.ind);

  return exact.length>=3?exact:[...exact,...byTag].slice(0,Math.max(6,exact.length));
}
function startTypePractice(id){

}

function helpBoxes(q){
  const s=session; if(!s) return "";
  let h="";
  if(s.decode&&s.decode[s.i]&&!(s.ans[s.i]&&s.ans[s.i].checked)) h+=decodeHTML(q.q.replace(/<[^>]+>/g," ")+" "+(q.data||""),true);
  if(s.hints&&s.hints[s.i]&&q.hint) h+=`<div class="hintbox">💡 ${q.hint}</div>`;
  const st=(s.steps||{})[s.i]||0; const a=s.ans[s.i];
  if(st&&q.sol&&!(a&&a.checked)){ const shown=q.sol.slice(0,st);
    h+=`<div class="stepbox"><b>🪜 Paso a paso</b><ol>${shown.map(t=>`<li>${t}</li>`).join("")}</ol>${st>=q.sol.length-1?`<p style="margin:6px 0 0;color:var(--text)">✍️ <b>Ahora tú:</b> haz el último cálculo y escribe el resultado.</p>`:""}</div>`; }
  return h;
}
function specMsg(q,a){
  if(q.type==="mc") return q.opts[a.v][1];
  const x=parseNum(a.raw); const e=(q.errs||[]).find(([val])=>close(x,val,0.03));
  return e?`🔎 ${e[1]}`:`Tu resultado (${fmt(x)}) todavía no es el correcto. ${q.hint?"Pista: "+q.hint:"Revisa la fórmula y las unidades."}${q.type==="num"&&q.sol?" También puedes usar «🪜 Guíame paso a paso».":""}`;
}
function vCero(v){
